<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Infinity Quest</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1> Infinity Quest</h1>

    <div id="createTab">
        <textarea id="textInput" placeholder="Write Your Topic here..."></textarea>

        <p>---------------------------- OR ----------------------------</p>

        <div class="file-btn" onclick="document.getElementById('pdfInput').click()">
            <button class="Documents-btn">
                <span class="folderContainer">
                    <svg class="fileBack" width="146" height="113" viewBox="0 0 146 113" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M0 4C0 1.79086 1.79086 0 4 0H50.3802C51.8285 0 53.2056 0.627965 54.1553 1.72142L64.3303 13.4371C65.2799 14.5306 66.657 15.1585 68.1053 15.1585H141.509C143.718 15.1585 145.509 16.9494 145.509 19.1585V109C145.509 111.209 143.718 113 141.509 113H3.99999C1.79085 113 0 111.209 0 109V4Z"
                            fill="url(#paint0_linear_117_4)"></path>
                        <defs>
                            <linearGradient id="paint0_linear_117_4" x1="0" y1="0" x2="72.93" y2="95.4804"
                                gradientUnits="userSpaceOnUse">
                                <stop stop-color="#a040fd"></stop>
                                <stop offset="1" stop-color="#5f41f3"></stop>
                            </linearGradient>
                        </defs>
                    </svg>
                    <svg class="filePage" width="88" height="99" viewBox="0 0 88 99" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <rect width="88" height="99" fill="url(#paint0_linear_117_6)"></rect>
                        <defs>
                            <linearGradient id="paint0_linear_117_6" x1="0" y1="0" x2="81" y2="160.5"
                                gradientUnits="userSpaceOnUse">
                                <stop stop-color="white"></stop>
                                <stop offset="1" stop-color="#686868"></stop>
                            </linearGradient>
                        </defs>
                    </svg>

                    <svg class="fileFront" width="160" height="79" viewBox="0 0 160 79" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M0.29306 12.2478C0.133905 9.38186 2.41499 6.97059 5.28537 6.97059H30.419H58.1902C59.5751 6.97059 60.9288 6.55982 62.0802 5.79025L68.977 1.18034C70.1283 0.410771 71.482 0 72.8669 0H77H155.462C157.87 0 159.733 2.1129 159.43 4.50232L150.443 75.5023C150.19 77.5013 148.489 79 146.474 79H7.78403C5.66106 79 3.9079 77.3415 3.79019 75.2218L0.29306 12.2478Z"
                            fill="url(#paint0_linear_117_5)"></path>
                        <defs>
                            <linearGradient id="paint0_linear_117_5" x1="38.7619" y1="8.71323" x2="66.9106" y2="82.8317"
                                gradientUnits="userSpaceOnUse">
                                <stop stop-color="#a040fd"></stop>
                                <stop offset="1" stop-color="#5251f2"></stop>
                            </linearGradient>
                        </defs>
                    </svg>
                </span>
                <p class="text">Upload PDF</p>
                <div id="fileName">No file chosen</div>
            </button>


        </div>
        <input type="file" id="pdfInput">

        <div class="number-box">
            <p>Number of questions:</p>
            <input type="number" id="qCount" value="30" min="10" max="150" placeholder="10 - 150 questions">
        </div>

        <button class="btn" onclick="startGeneration()">
            <svg height="24" width="24" fill="#FFFFFF" viewBox="0 0 24 24" data-name="Layer 1" id="Layer_1"
                class="sparkle">
                <path
                    d="M10,21.236,6.755,14.745.264,11.5,6.755,8.255,10,1.764l3.245,6.491L19.736,11.5l-6.491,3.245ZM18,21l1.5,3L21,21l3-1.5L21,18l-1.5-3L18,18l-3,1.5ZM19.333,4.667,20.5,7l1.167-2.333L24,3.5,21.667,2.333,20.5,0,19.333,2.333,17,3.5Z">
                </path>
            </svg>
            <span class="text">Generate</span>
        </button>
    </div>


    <div id="savedTab">
    </div>

    <div id="overlay">Generating MCQs...</div>



    <div class="glass-radio-group">
        <input type="radio" name="plan" id="glass-silver" checked="" />
        <label for="glass-silver">Create</label>

        <input type="radio" name="plan" id="glass-gold" />
        <label for="glass-gold">Questions</label>

        <div class="glass-glider"></div>
    </div>

    <div class="credit">Created by Arko Sarkar</div>
    <script src="script.js"></script>

</body>

</html>
